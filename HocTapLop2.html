<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bé Học Lớp 2</title>
<style>
  :root{
    --nen:#fff8ec; --giay:#ffffff; --chu:#26324a; --nhat:#6b7690; --vien:#eadfca;
    --toan:#2f7de1; --viet:#e0533d; --anh:#16a37a; --vang:#f5b81c; --dung:#1f9d55; --sai:#d64545;
    --bong:0 3px 0 rgba(0,0,0,.08), 0 8px 24px rgba(38,50,74,.08); --r:18px;
    --f:"Segoe UI","Nunito","Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --nen:#1b2130; --giay:#252d40; --chu:#eef2fa; --nhat:#a8b2c8; --vien:#38415a; --bong:none}}
  :root[data-theme="dark"]{--nen:#1b2130; --giay:#252d40; --chu:#eef2fa; --nhat:#a8b2c8; --vien:#38415a; --bong:none}
  *{box-sizing:border-box}
  body{margin:0;background:var(--nen);color:var(--chu);font:18px/1.5 var(--f);min-height:100vh}
  button{font:inherit;color:inherit;cursor:pointer}
  .wrap{max-width:980px;margin:0 auto;padding:0 16px}
  header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--nen) 92%,transparent);backdrop-filter:blur(6px);border-bottom:2px solid var(--vien)}
  .dau{display:flex;align-items:center;gap:12px;height:64px}
  .ten-app{font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;padding:0}
  .ten-app span{font-size:28px}
  .be-chip{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--giay);border:2px solid var(--vien);border-radius:999px;padding:4px 14px 4px 6px;font-weight:700}
  .be-chip b{font-size:26px}
  .sao{color:var(--vang);font-weight:800}
  .nut-nho{background:var(--giay);border:2px solid var(--vien);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}
  main{padding:22px 0 60px}
  h1{font-size:clamp(26px,4vw,36px);margin:4px 0 6px;line-height:1.2}
  h2{font-size:22px;margin:22px 0 10px}
  .phu{color:var(--nhat);margin:0 0 14px}
  .luoi{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .the{background:var(--giay);border:2px solid var(--vien);border-radius:var(--r);padding:18px;box-shadow:var(--bong);text-align:left;display:grid;gap:6px;align-content:start;transition:transform .12s}
  button.the:hover{transform:translateY(-3px)}
  .the .icon{font-size:42px;line-height:1}
  .the b{font-size:20px}
  .the small{color:var(--nhat);font-size:14px;line-height:1.4}
  .mon-toan{border-color:color-mix(in srgb,var(--toan) 45%,var(--vien))}
  .mon-viet{border-color:color-mix(in srgb,var(--viet) 45%,var(--vien))}
  .mon-anh{border-color:color-mix(in srgb,var(--anh) 45%,var(--vien))}
  .thanh{height:10px;border-radius:99px;background:var(--vien);overflow:hidden;margin-top:4px}
  .thanh i{display:block;height:100%;background:var(--mau,var(--dung));border-radius:99px}
  .hang-sao{font-size:18px;letter-spacing:2px;color:var(--vang)}
  .hang-sao .tat{color:var(--vien)}
  .chon-be{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin:30px 0}
  .chon-be button{width:220px;padding:26px 16px;font-size:22px;font-weight:800}
  .chon-be button span{font-size:72px;display:block}
  /* làm bài */
  .khung-cau{background:var(--giay);border:2px solid var(--vien);border-radius:24px;padding:22px;box-shadow:var(--bong)}
  .tien-do{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-weight:700;color:var(--nhat)}
  .tien-do .thanh{flex:1;margin:0}
  .de{font-size:clamp(22px,3.4vw,30px);font-weight:700;line-height:1.35;margin:4px 0 14px}
  .de .to{font-size:1.5em}
  .hinh{display:flex;justify-content:center;margin:6px 0 16px}
  .emoji-to{font-size:110px;line-height:1.1}
  .chon{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .chon button{background:var(--nen);border:3px solid var(--vien);border-radius:16px;padding:14px 10px;font-size:24px;font-weight:700;min-height:70px}
  .chon button:hover:not(:disabled){border-color:var(--mau,var(--toan))}
  .chon button.dung{background:color-mix(in srgb,var(--dung) 18%,var(--giay));border-color:var(--dung)}
  .chon button.sai{background:color-mix(in srgb,var(--sai) 15%,var(--giay));border-color:var(--sai)}
  .chon button .em{font-size:44px}
  .o-so{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .o-so output{min-width:150px;font-size:36px;font-weight:800;border:3px solid var(--vien);border-radius:14px;padding:6px 14px;text-align:center;background:var(--nen)}
  .ban-phim{display:grid;grid-template-columns:repeat(5,64px);gap:8px;margin-top:12px}
  .ban-phim button{height:58px;border-radius:14px;border:2px solid var(--vien);background:var(--giay);font-size:24px;font-weight:800}
  .ban-phim .xoa{background:color-mix(in srgb,var(--sai) 10%,var(--giay))}
  .ban-phim .ok{grid-column:span 2;background:var(--dung);border-color:var(--dung);color:#fff}
  .phan-hoi{margin-top:16px;border-radius:16px;padding:14px 16px;font-size:19px;display:none}
  .phan-hoi.hien{display:block}
  .phan-hoi.dung{background:color-mix(in srgb,var(--dung) 14%,var(--giay));border:2px solid var(--dung)}
  .phan-hoi.sai{background:color-mix(in srgb,var(--sai) 10%,var(--giay));border:2px solid var(--sai)}
  .phan-hoi pre{font:600 20px/1.35 Consolas,"Courier New",monospace;margin:8px 0;background:var(--giay);padding:8px 12px;border-radius:10px;display:inline-block}
  .hang-nut{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .nut{border:0;border-radius:14px;padding:12px 22px;font-weight:800;font-size:19px;background:var(--mau,var(--toan));color:#fff}
  .nut.phu{background:var(--giay);color:var(--chu);border:2px solid var(--vien)}
  .loa{background:none;border:2px solid var(--vien);border-radius:999px;padding:4px 12px;font-size:16px;font-weight:700;margin-left:8px;vertical-align:middle}
  .ket-qua{text-align:center}
  .ket-qua .lon{font-size:90px}
  .bang{width:100%;border-collapse:collapse;font-size:16px;background:var(--giay);border-radius:12px;overflow:hidden}
  .bang th,.bang td{padding:8px 10px;border-bottom:1px solid var(--vien);text-align:left;vertical-align:top}
  .bang th{background:var(--nen)}
  .phu-huynh label{display:flex;gap:10px;align-items:center;margin:8px 0;font-size:17px}
  .phu-huynh input[type=number]{width:80px;font:inherit;padding:4px 8px;border-radius:8px;border:2px solid var(--vien);background:var(--nen);color:var(--chu)}
  .man-che{position:fixed;inset:0;background:rgba(20,26,40,.6);display:grid;place-items:center;z-index:20;padding:16px}
  .man-che .the{max-width:440px;text-align:center}
  .phao{position:fixed;top:-20px;font-size:28px;animation:roi 1.6s linear forwards;pointer-events:none;z-index:30}
  @keyframes roi{to{transform:translateY(105vh) rotate(360deg);opacity:.6}}
  @media (prefers-reduced-motion:reduce){.phao{display:none}button.the:hover{transform:none}}
  @media (max-width:560px){.ban-phim{grid-template-columns:repeat(5,1fr)}.dau .an-nho{display:none}}
</style>
</head>
<body>
<header><div class="wrap dau">
  <button class="ten-app" id="ve-nha" aria-label="Về trang chủ"><span>🎒</span>Bé Học Lớp 2</button>
  <div class="be-chip" id="be-chip" hidden></div>
  <button class="nut-nho" id="nut-ph">Phụ huynh</button>
</div></header>
<main class="wrap" id="man"></main>

<script>
"use strict";
/* ==========================================================================
   SINH CÂU HỎI – theo yêu cầu cần đạt môn Toán, Tiếng Việt lớp 2 (Chương trình GDPT 2018,
   Thông tư 32/2018/TT-BGDĐT) và chủ đề từ vựng Tiếng Anh lớp 1–2.
   Mỗi câu: {de, kieu:'chon'|'so', lua_chon, dap_an, giai_thich, hinh?, doc?, noi_en?}
   ========================================================================== */
// ==== SINH CAU HOI (BAT DAU)
const ngau = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const chon1 = (a) => a[Math.floor(Math.random() * a.length)];
const tron = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* 4 phương án số khác nhau, gồm đáp án; nhiễu gần đáp án (lỗi hay gặp: quên nhớ, lệch 1, lệch 10). */
function phuongAnSo(dap, nhieu, min = 0, max = 1000) {
  const s = new Set([dap]);
  for (const x of tron(nhieu)) { if (s.size >= 4) break; if (Number.isInteger(x) && x >= min && x <= max) s.add(x); }
  let k = 1;
  while (s.size < 4) { for (const x of [dap + k, dap - k]) if (s.size < 4 && x >= min && x <= max) s.add(x); k++; }
  return tron([...s]).map(String);
}
function phuongAnChu(dap, kho, n = 4) {
  const s = [dap];
  for (const x of tron(kho)) { if (s.length >= n) break; if (!s.includes(x)) s.push(x); }
  return tron(s);
}

// ---------- đọc số tiếng Việt (0–1000)
const CS = ["không", "một", "hai", "ba", "bốn", "năm", "sáu", "bảy", "tám", "chín"];
function docSo(n) {
  if (n === 1000) return "một nghìn";
  if (n < 10) return CS[n];
  const tr = Math.floor(n / 100), ch = Math.floor((n % 100) / 10), dv = n % 10, s = [];
  if (tr) s.push(CS[tr] + " trăm");
  if (ch === 0) { if (dv) { if (tr) s.push("linh"); s.push(CS[dv]); } }
  else if (ch === 1) { s.push("mười"); if (dv) s.push(dv === 5 ? "lăm" : CS[dv]); }
  else { s.push(CS[ch] + " mươi"); if (dv === 1) s.push("mốt"); else if (dv === 4) s.push("tư"); else if (dv === 5) s.push("lăm"); else if (dv) s.push(CS[dv]); }
  return s.join(" ");
}

// ---------- đặt tính cộng, trừ có lời giải từng bước
function datTinh(a, b, dau) {
  const kq = dau === "+" ? a + b : a - b, w = Math.max(String(a).length, String(b).length, String(kq).length) + 1;
  const pad = (x) => String(x).padStart(w);
  const ke = "-".repeat(w);
  return `${pad(a)}\n${dau}${String(b).padStart(w - 1)}\n${ke}\n${pad(kq)}`;
}
const HANG = ["đơn vị", "chục", "trăm", "nghìn"];
const chuSo = (n, i) => Math.floor(n / 10 ** i) % 10;
/* Lời giải cộng theo cột, như cách dạy ở lớp 2: "8 cộng 5 bằng 13, viết 3 nhớ 1". */
function loiGiaiCong(a, b) {
  const la = String(a).length, lb = String(b).length, n = Math.max(la, lb), s = [];
  let nho = 0;
  for (let i = 0; i < n; i++) {
    const so = [i < la ? chuSo(a, i) : null, i < lb ? chuSo(b, i) : null].filter((x) => x !== null);
    const u = so.reduce((x, y) => x + y, 0) + nho;
    if (so.length === 1 && !nho) { s.push(`Hàng ${HANG[i]}: hạ ${u}.`); continue; }
    const bt = (so.length === 2 ? `${so[0]} cộng ${so[1]} bằng ${so[0] + so[1]}` : `${so[0]}`) + (nho ? (so.length === 2 ? `, thêm 1 bằng ${u}` : ` thêm 1 bằng ${u}`) : "");
    if (u >= 10 && i < n - 1) { s.push(`Hàng ${HANG[i]}: ${bt}, viết ${u % 10} nhớ 1.`); nho = 1; }
    else { s.push(`Hàng ${HANG[i]}: ${bt}, viết ${u}.`); nho = 0; }
  }
  return s.join("<br>");
}
/* Lời giải trừ theo cột: "2 không trừ được 7, lấy 12 trừ 7 bằng 5, viết 5 nhớ 1; 3 thêm 1 bằng 4…". */
function loiGiaiTru(a, b) {
  const la = String(a).length, lb = String(b).length, s = [];
  let nho = 0;
  for (let i = 0; i < la; i++) {
    const u = chuSo(a, i), db = i < lb ? chuSo(b, i) : 0, v = db + nho;
    const truSo = nho && i < lb ? `${db} thêm 1 bằng ${v}; ` : "";
    const tenV = i >= lb && nho ? "1 (nhớ)" : String(v);           // số trừ hết chữ số: chỉ còn trừ 1 nhớ
    if (u < v) { s.push(`Hàng ${HANG[i]}: ${truSo}${u} không trừ được ${tenV}, lấy ${u + 10} trừ ${tenV} bằng ${u + 10 - v}, viết ${u + 10 - v} nhớ 1.`); nho = 1; }
    else if (i >= lb && nho) {
      s.push(u - 1 === 0 && i === la - 1 ? `Hàng ${HANG[i]}: ${u} trừ 1 (nhớ) bằng 0, không viết.` : `Hàng ${HANG[i]}: ${u} trừ 1 (nhớ) bằng ${u - 1}, viết ${u - 1}.`);
      nho = 0;
    }
    else {
      const kq = u - v;
      if (i >= lb && !nho) s.push(`Hàng ${HANG[i]}: hạ ${u}.`);
      else if (i === la - 1 && kq === 0 && la > 1) s.push(`Hàng ${HANG[i]}: ${truSo}${u} trừ ${v} bằng 0, không viết.`);
      else s.push(`Hàng ${HANG[i]}: ${truSo}${u} trừ ${v} bằng ${kq}, viết ${kq}.`);
      nho = 0;
    }
  }
  return s.join("<br>");
}
const giaiThichCongTru = (a, b, dau) =>
  `Đặt tính rồi tính:<br><pre>${esc(datTinh(a, b, dau))}</pre><br>${dau === "+" ? loiGiaiCong(a, b) : loiGiaiTru(a, b)}`;
/* Cộng, trừ qua 10 trong phạm vi 20: tách số để làm tròn 10 (cách dạy ở lớp 1–2). */
function giaiThichQua10(a, b, dau) {
  if (dau === "+") { const can = 10 - a, con = b - can;
    return `Cộng qua 10: tách ${b} = ${can} + ${con}.<br>${a} + ${can} = 10; 10 + ${con} = <b>${a + b}</b>.`; }
  const dv = a - 10, con = b - dv;
  return `Trừ qua 10: tách ${b} = ${dv} + ${con}.<br>${a} - ${dv} = 10; 10 - ${con} = <b>${a - b}</b>.`;
}

// ---------- vẽ hình (SVG)
function dongHo(gio, phut) {
  const goc = (d) => (d - 90) * Math.PI / 180, cx = 100, cy = 100;
  let so = "";
  for (let i = 1; i <= 12; i++) {
    const g = goc(i * 30);
    so += `<text x="${cx + 74 * Math.cos(g)}" y="${cy + 74 * Math.sin(g) + 7}" font-size="20" font-weight="700" text-anchor="middle" fill="currentColor">${i}</text>`;
  }
  let vach = "";
  for (let i = 0; i < 60; i++) {
    const g = goc(i * 6), r1 = i % 5 ? 86 : 82;
    vach += `<line x1="${cx + r1 * Math.cos(g)}" y1="${cy + r1 * Math.sin(g)}" x2="${cx + 90 * Math.cos(g)}" y2="${cy + 90 * Math.sin(g)}" stroke="currentColor" stroke-width="${i % 5 ? 1 : 2.5}"/>`;
  }
  const gg = goc((gio % 12) * 30 + phut * 0.5), gp = goc(phut * 6);
  return `<svg viewBox="0 0 200 200" width="230" height="230" role="img" aria-label="Đồng hồ">
    <circle cx="100" cy="100" r="95" fill="var(--nen)" stroke="currentColor" stroke-width="5"/>${vach}${so}
    <line x1="100" y1="100" x2="${cx + 48 * Math.cos(gg)}" y2="${cy + 48 * Math.sin(gg)}" stroke="#e0533d" stroke-width="8" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="${cx + 72 * Math.cos(gp)}" y2="${cy + 72 * Math.sin(gp)}" stroke="#2f7de1" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="6" fill="currentColor"/></svg>`;
}
const svgBoc = (noi, w = 220, h = 170) => `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img">${noi}</svg>`;
const HINH = {
  "hình tứ giác": () => { const p = [[ngau(20, 60), ngau(20, 50)], [ngau(150, 200), ngau(15, 45)], [ngau(165, 205), ngau(120, 155)], [ngau(15, 70), ngau(115, 150)]];
    return svgBoc(`<polygon points="${p.map((x) => x.join(",")).join(" ")}" fill="#ffd47a" stroke="currentColor" stroke-width="4"/>`); },
  "hình tam giác": () => svgBoc(`<polygon points="${ngau(20, 60)},150 ${ngau(150, 200)},150 ${ngau(70, 140)},${ngau(15, 40)}" fill="#9fd3ff" stroke="currentColor" stroke-width="4"/>`),
  "hình tròn": () => svgBoc(`<circle cx="110" cy="85" r="65" fill="#ffb3a7" stroke="currentColor" stroke-width="4"/>`),
  "khối trụ": () => svgBoc(`<path d="M60 40 v95 a50 18 0 0 0 100 0 v-95" fill="#b6e3b6" stroke="currentColor" stroke-width="4"/><ellipse cx="110" cy="40" rx="50" ry="18" fill="#d6f2d6" stroke="currentColor" stroke-width="4"/>`),
  "khối cầu": () => svgBoc(`<defs><radialGradient id="cau" cx=".35" cy=".35"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f08a8a"/></radialGradient></defs><circle cx="110" cy="85" r="68" fill="url(#cau)" stroke="currentColor" stroke-width="4"/>`),
  "khối lập phương": () => svgBoc(`<polygon points="60,60 130,60 130,140 60,140" fill="#ffd47a" stroke="currentColor" stroke-width="4"/><polygon points="60,60 95,30 165,30 130,60" fill="#ffe7b0" stroke="currentColor" stroke-width="4"/><polygon points="130,60 165,30 165,110 130,140" fill="#f2bd52" stroke="currentColor" stroke-width="4"/>`),
};

// ---------- dữ liệu dùng chung
const TEN = ["Lan", "Minh", "Hoa", "Nam", "An", "Mai", "Bình", "Hà", "Tú", "Linh"];
// [đồ vật, hình, vật đựng hợp với đồ vật đó (dùng cho bài nhân, chia)]
const VAT = [["quả cam", "🍊", "đĩa"], ["cái kẹo", "🍬", "túi"], ["bông hoa", "🌼", "lọ"], ["quyển vở", "📒", "chồng"], ["viên bi", "🔵", "hộp"], ["con gà", "🐔", "chuồng"], ["cái bánh", "🍪", "hộp"], ["quả táo", "🍎", "giỏ"]];

/* ======================= TOÁN ======================= */
const TOAN = [
  { id: "so1000", ten: "Số trong phạm vi 1000", icon: "🔢", yc: "Đọc, viết, cấu tạo số; so sánh, số liền trước, liền sau.", sinh(cap) {
    const n = cap === 1 ? ngau(11, 99) : cap === 2 ? ngau(100, 999) : ngau(100, 999);
    const tr = Math.floor(n / 100), ch = Math.floor((n % 100) / 10), dv = n % 10;
    const loai = chon1(cap === 1 ? ["lien", "cautao", "sosanh", "doc"] : ["cautao", "doc", "viet", "lien", "sosanh", "lonnhat", "tron"]);
    if (loai === "cautao") {
      const de = n >= 100 ? `Số gồm <b>${tr} trăm, ${ch} chục và ${dv} đơn vị</b> là số nào?` : `Số gồm <b>${ch} chục và ${dv} đơn vị</b> là số nào?`;
      return { de, kieu: "so", dap_an: String(n), giai_thich: n >= 100 ? `${tr} trăm = ${tr * 100}, ${ch} chục = ${ch * 10}, ${dv} đơn vị = ${dv}.<br>${tr * 100} + ${ch * 10} + ${dv} = <b>${n}</b>.` : `${ch} chục = ${ch * 10}; ${ch * 10} + ${dv} = <b>${n}</b>.` };
    }
    if (loai === "doc") {

});
function traLoi(x, nutBam) {
  if (BAI.daTraLoi) return;
  BAI.daTraLoi = true;
  const q = BAI.cau[BAI.i], dung = x === q.dap_an, ph = document.getElementById("phan-hoi");
  BAI.daLam++;
  const t = ttChuDe(q.cd); t.tong++;
  if (dung) { t.dung++; BAI.dung++; tieng(true); if (q.on_lai) be().sai = be().sai.filter((s) => s.q.de !== q.de || s.q.dap_an !== q.dap_an); }
  else {
    tieng(false); BAI.sai.push(q);
    if (!q.on_lai) { be().sai = [{ q, ngay: homNay(), tl: x }].concat(be().sai.filter((s) => s.q.de !== q.de)).slice(0, 40); }
  }
  luuDL();
  if (q.kieu === "chon") man.querySelectorAll("[data-x]").forEach((b) => { b.disabled = true; if (b.dataset.x === q.dap_an) b.classList.add("dung"); else if (b === nutBam) b.classList.add("sai"); });
  else { const o = document.getElementById("o-nhap"); o.style.borderColor = dung ? "var(--dung)" : "var(--sai)"; man.querySelectorAll("[data-n]").forEach((b) => (b.disabled = true)); }
  ph.className = "phan-hoi hien " + (dung ? "dung" : "sai");
  ph.innerHTML = `<b style="font-size:22px">${dung ? "🎉 " + chon1(KHEN) : "💡 " + chon1(DONG_VIEN)}</b>${dung ? "" : `<br>Đáp án đúng: <b>${q.hinh_lc ? q.dap_an : esc(q.dap_an)}</b>`}<div style="margin-top:6px">${q.giai_thich}</div>
    <div class="hang-nut"><button class="nut" id="tiep">${BAI.i + 1 < BAI.cau.length ? "Câu tiếp theo →" : "Xem kết quả"}</button></div>`;
  if (q.noi_sau) noi(q.noi_sau, "en-US");
  const tiep = document.getElementById("tiep"); tiep.focus(); tiep.onclick = () => { BAI.i++; BAI.i < BAI.cau.length ? veCau() : ketThuc(); };
}
function ketThuc() {
  const lam = BAI.daLam, n = Math.max(lam, 1);                // số câu bé đã thực sự trả lời
  if (!lam) return manChinh();
  const tl = BAI.dung / n, sao = lam < 10 ? (tl >= 0.9 ? 1 : 0) : tl >= 0.9 ? 3 : tl >= 0.7 ? 2 : tl >= 0.5 ? 1 : 0;
  const giay = Math.round((Date.now() - BAI.batDau) / 1000);
  let thongBaoCap = "";
  if (BAI.mon !== "on" && BAI.cdId !== "__tron" && lam >= 10) {
    const t = ttChuDe(BAI.cdId); t.lan++;
    const truoc = t.sao; t.sao = Math.max(t.sao, sao); be().sao += Math.max(0, t.sao - truoc);
    if (tl >= 0.9 && t.cap < 3) { t.cap++; thongBaoCap = `Lên cấp ${t.cap}! Bài sau sẽ khó hơn một chút.`; }
    else if (tl < 0.5 && t.cap > 1) { t.cap--; thongBaoCap = `Mình luyện lại cấp ${t.cap} cho chắc nhé.`; }
  } else if (lam >= 10) be().sao += sao;
  be().lich_su = [{ ngay: homNay(), cd: BAI.cdId === "__tron" ? "Trộn " + MON[BAI.mon].ten : BAI.mon === "on" ? "Ôn câu sai" : (timChuDe(BAI.cdId)[1] || {}).ten, dung: BAI.dung, tong: lam, giay }].concat(be().lich_su).slice(0, 50);
  luuDL(); capNhatDau();
  if (sao >= 2) phaoHoa();
  man.innerHTML = `<div class="khung-cau ket-qua"><div class="lon">${sao === 3 ? "🏆" : sao === 2 ? "🌟" : sao === 1 ? "👍" : "💪"}</div>
    <h1>${sao === 3 ? "Xuất sắc!" : sao === 2 ? "Giỏi lắm!" : sao === 1 ? "Khá lắm!" : "Cố gắng thêm nhé!"}</h1>
    <p style="font-size:22px">Đúng <b>${BAI.dung}/${lam}</b> câu · ${Math.floor(giay / 60)} phút ${giay % 60} giây</p>
    <div style="font-size:40px">${veSao(sao)}</div>${thongBaoCap ? `<p><b>${thongBaoCap}</b></p>` : ""}
    ${BAI.sai.length ? `<p class="phu">${BAI.sai.length} câu sai đã được lưu vào mục “Ôn câu đã sai”.</p>` : ""}
    <div class="hang-nut" style="justify-content:center"><button class="nut" id="lai">Làm bài mới</button><button class="nut phu" id="ve">Về trang chính</button></div></div>`;
  document.getElementById("lai").onclick = () => (BAI.mon === "on" ? (be().sai.length ? batDau("on") : manChinh()) : batDau(BAI.mon, BAI.cdId));
  document.getElementById("ve").onclick = manChinh;
}

/* --- phụ huynh */
function cuaPhuHuynh() {
  const a = ngau(12, 19), b = ngau(6, 9);
  const d = document.createElement("div");
  d.className = "man-che";
  d.innerHTML = `<form class="the"><h2 style="margin:0">Dành cho phụ huynh</h2><p>Để vào, bố mẹ tính: <b>${a} × ${b} = ?</b></p>
    <input type="number" inputmode="numeric" style="font:inherit;font-size:26px;width:140px;padding:6px;border-radius:10px;border:2px solid var(--vien);text-align:center" autofocus>
    <div class="hang-nut" style="justify-content:center"><button class="nut">Vào</button><button type="button" class="nut phu">Hủy</button></div></form>`;
  d.querySelector(".phu").onclick = () => d.remove();
  d.querySelector("form").onsubmit = (e) => { e.preventDefault(); if (Number(d.querySelector("input").value) === a * b) { d.remove(); manPhuHuynh(); } else d.querySelector("input").value = ""; };
  document.body.appendChild(d);
  d.querySelector("input").focus();
}
function manPhuHuynh() {
  const hang = Object.entries(DL.ho_so).map(([k, v]) => {
    const ngay7 = Array.from({ length: 7 }, (_, i) => { const d = new Date(Date.now() - i * 864e5); const s = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; return Math.round(v.phut[s] || 0); });
    const cd = Object.entries(MON).flatMap(([mk, m]) => m.ds.map((c) => { const t = v.chu_de[c.id] || { tong: 0, dung: 0, sao: 0, cap: 1, lan: 0 };
      return `<tr><td>${c.icon} ${esc(c.ten)}</td><td>${t.lan}</td><td>${t.tong ? Math.round((100 * t.dung) / t.tong) + "%" : "–"}</td><td>${veSao(t.sao)}</td><td>${t.cap}</td></tr>`; })).join("");
    const sai = v.sai.slice(0, 12).map((s) => `<tr><td>${s.ngay}</td><td>${s.q.de.replace(/<button.*?<\/button>/g, "")}</td><td>${s.q.hinh_lc ? s.tl : esc(s.tl)}</td><td>${s.q.hinh_lc ? s.q.dap_an : esc(s.q.dap_an)}</td></tr>`).join("");
    return `<h2>${v.icon} Bé ${esc(v.ten)} · ★ ${v.sao}</h2>
      <p>Thời gian học 7 ngày gần nhất (phút, mới nhất trước): <b>${ngay7.join(" · ")}</b></p>
      <details><summary><b>Tiến độ theo chủ đề</b></summary><table class="bang"><tr><th>Chủ đề</th><th>Số bài</th><th>Tỉ lệ đúng</th><th>Sao</th><th>Cấp</th></tr>${cd}</table></details>
      <details ${sai ? "open" : ""}><summary><b>Câu bé làm sai gần đây (${v.sai.length})</b></summary>${sai ? `<table class="bang"><tr><th>Ngày</th><th>Câu hỏi</th><th>Bé chọn</th><th>Đáp án</th></tr>${sai}</table>` : "<p>Chưa có.</p>"}</details>`;
  }).join("");
  man.innerHTML = `<div class="phu-huynh"><button class="nut phu" id="lui">← Về</button>
    <h1 style="margin-top:12px">Góc phụ huynh</h1>
    <p class="phu">Nội dung bám theo yêu cầu cần đạt môn Toán, Tiếng Việt lớp 2 (Chương trình GDPT 2018) và từ vựng Tiếng Anh chủ đề quen thuộc. Bố mẹ nên đối chiếu thêm với sách giáo khoa con đang học. Tiến độ chỉ lưu trên máy này.</p>
    <h2>Cài đặt</h2>
    <label>Giới hạn học mỗi ngày <input type="number" id="cd-gh" min="10" max="180" value="${DL.cai_dat.gioi_han}"> phút</label>
    <label>Nhắc nghỉ mắt sau <input type="number" id="cd-ns" min="5" max="60" value="${DL.cai_dat.nghi_sau}"> phút học liên tục</label>
    <label><input type="checkbox" id="cd-doc" ${DL.cai_dat.tu_doc ? "checked" : ""}> Tự đọc câu hỏi tiếng Việt (${coGiongViet() ? "máy có giọng đọc tiếng Việt" : "máy chưa có giọng đọc tiếng Việt, cài thêm trong Cài đặt Windows › Thời gian và ngôn ngữ › Giọng nói"})</label>
    <div class="hang-nut"><button class="nut" id="cd-luu">Lưu cài đặt</button><button class="nut phu" id="cd-them">Cho học thêm 15 phút hôm nay</button></div>
    ${hang}
    <h2>Dữ liệu</h2><div class="hang-nut"><button class="nut phu" id="xoa-dl">Xóa toàn bộ tiến độ</button></div></div>`;
  document.getElementById("lui").onclick = () => (DL.be ? manChinh() : manChonBe());
  document.getElementById("cd-luu").onclick = () => {
    DL.cai_dat.gioi_han = Math.min(180, Math.max(10, Number(document.getElementById("cd-gh").value) || 40));
    DL.cai_dat.nghi_sau = Math.min(60, Math.max(5, Number(document.getElementById("cd-ns").value) || 20));
    DL.cai_dat.tu_doc = document.getElementById("cd-doc").checked; luuDL(); manChe("✅", "Đã lưu", "Cài đặt đã được lưu.", "OK");
  };
  document.getElementById("cd-them").onclick = () => { for (const v of Object.values(DL.ho_so)) v.phut[homNay()] = Math.max(0, (v.phut[homNay()] || 0) - 15); luuDL(); manChe("⏰", "Đã cho thêm 15 phút", "Các bé được học thêm 15 phút hôm nay.", "OK"); };
  document.getElementById("xoa-dl").onclick = () => { if (confirm("Xóa toàn bộ sao, tiến độ, lịch sử của cả hai bé?")) { localStorage.removeItem(KHOA); DL = docDL(); manChonBe(); } };
}

document.getElementById("ve-nha").onclick = () => (DL.be ? manChinh() : manChonBe());
document.getElementById("nut-ph").onclick = cuaPhuHuynh;
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};
DL.be && DL.ho_so[DL.be] ? manChinh() : manChonBe();
</script>
</body>
</html>
